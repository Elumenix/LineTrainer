<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineTrainer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="container">
        <canvas id="vectorCanvas"></canvas>
    </div>
    <div id="options">  
        <button id="generateButton" data-mode="draw">Generate</button>
        <label class="toggle-container">
            <span class="label-text label-left">Line Mode</span>
            
            <input type="checkbox" class="toggle-input" id="renderMode" checked>
            <span class="toggle-track"></span>
            
            <span class="label-text label-right">Box Mode</span>
        </label>
    </div>
    <script type="module" src="src/main.ts"></script>
</body>

</html>
